plugins {
    id 'java'
    id 'maven-publish'
    id 'idea'
    id 'architectury-plugin' version "${architectury_version}"
    id 'dev.architectury.loom' version "${loom_version}"
}

architectury {
    platformSetupLoomIde()
    forge()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.parchmentmc.org' }
}

base {
    archivesName = "${rootProject.mod_id}-forge"
}

// Compile the common sources straight into this module so the mixins and the
// client/server split see one classpath.
sourceSets.main.java.srcDir(project(":common").sourceSets.main.java.srcDirs)
sourceSets.main.resources.srcDir(project(":common").sourceSets.main.resources.srcDirs)

configurations {
    common
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    forge "net.minecraftforge:forge:${forge_version}"
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.1.12"
    compileOnly "su.plo.voice.api:server:2.1.13"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    exclude '**/buildtool/**'
}

// The jar is downloaded on its own, so LICENSE and THIRD-PARTY.md have to sit inside it.
tasks.withType(Jar).configureEach {
    from(rootProject.file("LICENSE"))
    from(rootProject.file("THIRD-PARTY.md"))
}

loom {
    runs {
        client {
            client()
            setConfigName("Forge Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Forge Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
