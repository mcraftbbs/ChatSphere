# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury TransformingTask is not configuration-cache compatible (Gradle 9.5)
org.gradle.configuration-cache=false
# Loom requires Gradle to run on Java 21; this is the JDK auto-provisioned
# by the foojay toolchain resolver. Set JAVA_HOME yourself to override.
org.gradle.java.home=C:/Users/33947/.gradle/jdks/eclipse_adoptium-21-amd64-windows.2

# Minecraft 1.20.1 branch (Fabric only; NeoForge does not exist for 1.20.1)
minecraft_version=1.20.1
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
mod_id=chatsphere
# The human-readable display name for the mod.
mod_name=ChatSphere
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GNU LGPLv3
# The mod version. See https://semver.org/
mod_version=2.3.0-1.20.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
mod_group_id=cn.sarskin.ChatSphere

# Architectury multi-platform build (Fabric only)
architectury_version=3.4.161
loom_version=1.14.473
fabric_loader_version=0.16.10
fabric_api_version=0.92.11+1.20.1
