plugins {
    id 'java'
    id 'maven-publish'
    id 'idea'
    id 'architectury-plugin' version "${architectury_version}"
    id 'dev.architectury.loom' version "${loom_version}"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven { url = 'https://maven.parchmentmc.org' }
}

base {
    archivesName = "${rootProject.mod_id}-neoforge"
}

// Compile the common sources directly into this module: the NeoForge dev runtime
// builds a single JPMS module per mod jar, so a separate common jar would either
// split packages or hide the mixin classes. Common code is loader-agnostic, so
// compiling it here (and for Fabric) is safe; no transform output is needed.
sourceSets.main.java.srcDir(project(":common").sourceSets.main.java.srcDirs)
sourceSets.main.resources.srcDir(project(":common").sourceSets.main.resources.srcDirs)

sourceSets.main.resources {
    exclude("opencode.json")
    exclude("INSTRUCTIONS.md")
    exclude("mc-src/**")
    exclude(".opencode/**")
}

configurations {
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    neoForge "net.neoforged:neoforge:${neo_version}"
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.1.12"
    compileOnly "su.plo.voice.api:server:2.1.13"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    exclude '**/buildtool/**'
}

loom {
    runs {
        client {
            client()
            setConfigName("NeoForge Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("NeoForge Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
